name: Deploy to Prd Workflow

on:
  push:
    tags:
      - "v*.*"

jobs:
  cd-deploy-prod:
    name: Deploy to PROD
    runs-on: ubuntu-24.04
    environment: prd
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Tag情報取得のため完全な履歴取得
          fetch-depth: 0

      - name: Verify tag on main branch
        run: |
          TAG="${{ github.ref_name }}"
          # main ブランチに属しているかを確認
          if ! git merge-base --is-ancestor $TAG origin/main; then
            echo "❌ Error: Tag '$TAG' is not on main branch"
            exit 1
          fi
          echo "✅ Tag verified on main branch"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Databricks CLI
        run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install setuptools wheel

      - name: Configure Databricks
        run: |
          # write out the profile (here called "PROD")
          cat <<EOF > ~/.databrickscfg
          [PRD]
          host  = ${{ secrets.HOST }}
          token = ${{ secrets.PAT }}
          EOF

      - name: Deploy to PROD
        run: |
          databricks bundle deploy \
            --target prd
