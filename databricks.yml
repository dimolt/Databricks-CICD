# This is a Databricks asset bundle definition for dab_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_project
  uuid: 39ac576f-c67f-4ed9-92b9-a7d2b93fb48e

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    default: "citibike_dev"

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-5c5d11a8-7d16.cloud.databricks.com
      root_path: /Workspace/Users/realnowhereman@icloud.com/bundle_${bundle.target}/${bundle.name}
    variables:
      catalog:
  test:
    mode: production
    workspace:
      host: https://dbc-5c5d11a8-7d16.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/realnowhereman@icloud.com to make sure we only have a single copy.
      root_path: /Workspace/Shared/bundle_${bundle.target}/${bundle.name}
    variables:
      catalog:
        default: "citibike_test"
  prd:
    mode: production
    workspace:
      host: https://dbc-5c5d11a8-7d16.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/realnowhereman@icloud.com to make sure we only have a single copy.
      #root_path: /Workspace/Users/realnowhereman@icloud.com/bundle_${bundle.target}/${bundle.name}
      root_path: /Workspace/Shared/bundle_${bundle.target}/${bundle.name}
    variables:
      catalog:
        default: "citibike_prd"
    permissions:
      - user_name: realnowhereman@icloud.com
        level: CAN_MANAGE